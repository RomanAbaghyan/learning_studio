  <!-- KaTeX for rendering the homework math (loaded only on the math track) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script>
    /* typesetMath(el): render \( \) and \[ \] via KaTeX auto-render.
       KaTeX loads deferred, after track.js runs — queue until it's ready. */
    window.__mathQueue = [];
    window.typesetMath = function (el) {
      if (window.renderMathInElement) {
        renderMathInElement(el, {
          delimiters: [
            { left: "\\[", right: "\\]", display: true },
            { left: "\\(", right: "\\)", display: false },
          ],
          throwOnError: false,
        });
      } else {
        window.__mathQueue.push(el);
      }
    };
    window.addEventListener("load", function () {
      window.__mathQueue.splice(0).forEach(function (el) { window.typesetMath(el); });
    });
  </script>
</head>
