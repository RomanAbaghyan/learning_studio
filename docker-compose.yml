# 1991 Academy with Docker. Use it through the Makefile: `make up`, `make logs`,
# `make backup` and so on (`make` lists them). What `make up` starts depends on
# DOMAIN in .env:
#
#   DOMAIN=academy.example.com   this file: the app + Caddy serving https://DOMAIN
#   DOMAIN= (empty)              this file + docker-compose.local.yml, app only:
#                                http://localhost:8735 on your own computer
#
# Three containers, and that's everything:
#   app     app.py: the API *and* the frontend. The database is a SQLite file in
#           the `data` volume, created on first start; there is no database server.
#   runner  compiles and runs learners' C++ (JavaScript and Python run in their
#           browsers). Locked down: no network, nothing inside worth taking.
#   caddy   HTTPS: gets and renews the certificate for $DOMAIN, forwards to app.
#
# Settings come from .env (copy .env.example). README.md → "Run with Docker".

# Fixed, so the volumes are always academy_data etc. Without it they'd be named
# after this folder, and renaming or re-cloning it would start an empty database.
name: academy

x-logging: &logging
  # Docker keeps container logs forever by default; cap them at 5 × 10 MB.
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  app:
    build:
      context: .
      args:
        REVISION: ${REVISION:-}
    image: 1991-academy
    restart: unless-stopped
    env_file:
      - path: .env        # SMTP settings for password-reset emails
        required: false
    environment:
      # Only Caddy (on the internal Docker network) and this machine reach the
      # app, and Caddy sets X-Forwarded-For itself, so it can be trusted.
      ACADEMY_TRUST_PROXY: "1"
      ACADEMY_BASE_URL: https://${DOMAIN:-localhost}
      # C++ goes to the runner container through this socket, never compiled here.
      ACADEMY_CPP_RUNNER: /run/cpp/runner.sock
    volumes:
      - data:/data
      - cpp-socket:/run/cpp
    ports:
      # Loopback only: for `make status` on a server, and the site itself on
      # your own computer. Never publish it on 0.0.0.0: Docker's published
      # ports bypass ufw, and clients could then forge X-Forwarded-For.
      - "127.0.0.1:8735:8735"
    # The app writes only its database; everything else is read-only.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      runner:
        condition: service_healthy
    logging: *logging

  # Learners' C++ runs here, one program per throwaway user, never as root
  # (runner/cpp_runner.py has the details). If someone's program is hostile,
  # this is all it can reach:
  runner:
    build: runner
    image: 1991-academy-runner
    restart: unless-stopped
    # A real init as process 1, to collect the exit of every process a program
    # leaves orphaned; uncollected, they would pile up and use up the limits.
    init: true
    # No network at all, not even to the app: it can't attack other machines,
    # download anything, or reach the app with forged headers. The app talks
    # to it through a socket file in this volume, which only the app's group
    # (10001) may open.
    network_mode: none
    volumes:
      - cpp-socket:/run/cpp
    read_only: true
    tmpfs:
      # where programs are compiled and run; each run's files are deleted after it
      - /work:rw,exec,nosuid,nodev,size=256m,mode=1777
    # Root inside the container keeps only what it needs to hand each program
    # to its own user, set that user's files up, and stop it afterwards.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true
    # Two programs at a time (CPP_SLOTS), each with its own CPU, memory and
    # process limits; these cap the whole container on top.
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # the HTTPS certificates: keep this volume
      - caddy-config:/config
    logging: *logging

volumes:
  data:          # the database (academy.db) and in-container backups
  cpp-socket:    # app ↔ runner socket; holds nothing else
  caddy-data:
  caddy-config:
